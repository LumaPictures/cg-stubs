# mypy configuration used by tests/test_mypy_plugin.py to check
# the generated mypy_plugin_test_*.py files with the types_pyside6_mypy_plugin
# plugin enabled.
# Mirrors the strictness of the [tool.mypy] config in pyproject.toml.
# The plugin is referenced by path (relative to this file) so that it does not
# need to be installed; users of the published wheel enable it by module name:
#     plugins = types_pyside6_mypy_plugin
[mypy]
strict = True
plugins = ../types_pyside6_mypy_plugin/__init__.py

[mypy-PySide6.*]
disable_error_code = no-untyped-def, type-arg

[mypy-shiboken6.*]
disable_error_code = no-untyped-def, type-arg
