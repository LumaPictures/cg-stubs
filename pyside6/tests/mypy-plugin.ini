# mypy configuration used by tests/test_signal_object_plugin.py to check
# signal_object_plugin_cases.py with the pyside6_stubs_mypy_plugin plugin
# enabled.  Mirrors the strictness of the [tool.mypy] config in pyproject.toml.
# The plugin is referenced by path (relative to this file) so that it does not
# need to be installed; users of the published wheel enable it by module name:
#     plugins = pyside6_stubs_mypy_plugin
[mypy]
strict = True
plugins = ../pyside6_stubs_mypy_plugin/__init__.py

[mypy-PySide6.*]
disable_error_code = no-untyped-def, type-arg

[mypy-shiboken6.*]
disable_error_code = no-untyped-def, type-arg
