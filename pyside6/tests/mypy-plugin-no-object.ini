# Like mypy-plugin.ini, but with the object_as_any option turned off; used by
# tests/test_mypy_plugin.py to check mypy_plugin_no_object_cases.py.  Also
# exercises the ini-style [types-pyside6-mypy] section of the plugin's
# configuration (the pyproject.toml style is exercised by a config generated
# in the test).
[mypy]
strict = True
plugins = ../types_pyside6_mypy_plugin/__init__.py

[types-pyside6-mypy]
object_as_any = False

[mypy-PySide6.*]
disable_error_code = no-untyped-def, type-arg

[mypy-shiboken6.*]
disable_error_code = no-untyped-def, type-arg
